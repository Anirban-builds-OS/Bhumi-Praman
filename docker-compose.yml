# Not validated against a live Docker daemon in this build's environment
# (none was available) -- review before relying on it in production. See
# README.md's Deployment section.
#
# Usage: docker compose up --build
# Frontend: http://localhost:8080   Backend API: http://localhost:8000

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/backend/db/bhumi_praman.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - CORS_ORIGINS=http://localhost:8080
    volumes:
      - bp_backend_db:/app/backend/db
      - bp_storage:/app/storage

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  bp_backend_db:
  bp_storage:
